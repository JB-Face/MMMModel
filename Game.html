<!DOCTYPE html>
<html lang="zh">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>MMM_Model 0.5</title>
    <link rel="stylesheet" href="styles.css">
    <!-- 加载QRCode库 -->
    <script src="lib/qrcode.min.js"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/qrcodejs/1.0.0/qrcode.min.js"></script>
    <script>
        // 检查QRCode库加载状态
        window.qrCodeLoaded = false;
        window.addEventListener('load', function() {
            if (typeof QRCode !== 'undefined') {
                console.log('QRCode库已成功加载');
                window.qrCodeLoaded = true;
            } else {
                console.warn('QRCode库未加载，将使用备用方法');
                // 如果CDN和本地库都加载失败，尝试再次加载本地库
                var script = document.createElement('script');
                script.src = 'lib/qrcode.min.js';
                script.onload = function() {
                    console.log('动态加载QRCode库成功');
                    window.qrCodeLoaded = true;
                };
                document.head.appendChild(script);
            }
        });
    </script>
</head>

<body>
    <div class="container">


        <!-- 游戏主要内容 -->
        <div class="game-content">
            <div class="control-section active">

            </div>

            <!-- 商店区域 - 改为折叠面板 -->
            <div class="collapsible-panel">
                <div class="panel-header" onclick="togglePanel('shop-section')">
                    <h2>商店</h2>
                    <span class="toggle-icon">▼</span>
                </div>
                <div class="panel-content" id="shop-section">
                    <span id="shopCoins" class="coin-display">金币: 1000</span>
                    <div class="shop-tabs">
                        <button class="shop-tab-btn active" data-tab="cat-shop">猫咪商店</button>
                        <button class="shop-tab-btn" data-tab="ticket-shop">机票商店</button>
                    </div>

                    <div class="shop-tab-content active" id="cat-shop">
                        <div class="shop-controls">
                            <button id="refreshShop" class="secondary-button">刷新商店（50金币）</button>
                        </div>
                        <div id="shopCats" class="shop-items"></div>
                    </div>

                    <div class="shop-tab-content" id="ticket-shop">
                        <div id="shopTickets" class="shop-items"></div>
                    </div>
                </div>
            </div>

            <!-- 出游和机票管理区域 - 也改为折叠面板 -->
            <div class="collapsible-panel">
                <div class="panel-header" onclick="togglePanel('travel-section')">
                    <h2>出游与机票</h2>
                    <span class="toggle-icon">▼</span>
                </div>
                <div class="panel-content" id="travel-section">
                    <div class="travel-tabs">
                        <button class="travel-tab-btn active" data-tab="my-tickets">我的机票</button>
                        <button class="travel-tab-btn" data-tab="travel-plan">出游行程</button>
                        <button class="travel-tab-btn" data-tab="postcard-gallery">明信片图鉴</button>
                        <button class="travel-tab-btn" data-tab="my-shares">我的分享</button>
                    </div>

                    <!-- 我的机票 -->
                    <div class="travel-tab-content active" id="my-tickets">
                        <h3>我的机票</h3>
                        <div id="ticketInventory" class="tickets-display"></div>
                    </div>

                    <!-- 出游行程 -->
                    <div class="travel-tab-content" id="travel-plan">
                        <h3>出游行程</h3>
                        <div class="travel-status">
                            <div id="travelStatus" class="status-display">未出游</div>
                            <button id="startTravel" class="primary-button">开始出游</button>
                            <button id="endTravel" class="secondary-button" disabled>结束出游</button>
                        </div>
                        <div id="travelTickets" class="tickets-display"></div>
                    </div>

                    <!-- 明信片图鉴 -->
                    <div class="travel-tab-content" id="postcard-gallery">
                        <h3>明信片图鉴</h3>
                        <div class="gallery-stats">
                            <span>已收集: <span id="postcardCount">0</span> 张</span>
                        </div>
                        <div id="postcardGallery" class="gallery-display"></div>
                    </div>

                    <!-- 我的分享 -->
                    <div class="travel-tab-content" id="my-shares">
                        <h3>我的分享</h3>
                        <div class="shares-stats">
                            <span>当前分享: <span id="sharesCount">0</span> 个</span>
                        </div>
                        <div id="sharesDisplay" class="shares-display"></div>
                    </div>
                </div>
            </div>

            <!-- 手动培育区域 -->
            <div class="manual-breeding-section">
                <div class="breeding-pool">
                    <div class="parameter-group">
                        <button id="openEncyclopedia" class="primary-button">打开猫咪图鉴</button>
                    </div>
                    <h2>培育池</h2>
                    <div id="breedingPool" class="cats-display"></div>
                    <button id="addRandomCat" class="secondary-button">添加随机猫咪</button>
                    <button id="getgenevalue" class="secondary-button">输出基因数据</button>
                    <button id="showGene" class="secondary-button">显示基因</button>
                    <button id="hideGene" class="secondary-button">隐藏基因</button>
                </div>

                <!-- 添加下一天按钮 -->
                <div class="generation-control">
                    <button id="nextGeneration" class="primary-button">进入下一天</button>
                </div>

                <!-- <div class="breeding-pair">
                    <h2>配对选择</h2>
                    <div class="pair-selection">
                        <select id="parent1" class="parent-select" aria-label="选择父本">
                            <option value="">选择父本...</option>
                        </select>
                        <span class="breeding-symbol">×</span>
                        <select id="parent2" class="parent-select" aria-label="选择母本">
                            <option value="">选择母本...</option>
                        </select>
                        <button id="breedPair" class="primary-button">配对</button>
                    </div>
                </div> -->


            </div>
            <header class="main-header">
                <a href="javascript:void(0)" onclick="logout()" class="back-link">退出登录</a>
                <a href="api_test.html" class="back-link">API测试</a>
            </header>

        </div>
    </div>

    <script src="script.js"></script>
    <script>
        function startGame() {
            document.querySelector('.game-content').classList.add('active');
            // 这里可以添加游戏初始化的代码
            // 初始化金币和生成初始猫咪等
        }

        function DataEditor() {
            window.open('edit_probability.html', '概率编辑器', 'width=800,height=600');
        }

        function APITest() {
            window.open('api_test.html', 'API测试', 'width=800,height=600');
        }

        // 折叠面板切换函数
        function togglePanel(panelId) {
            const panel = document.getElementById(panelId);
            panel.classList.toggle('open');
            const header = panel.previousElementSibling;
            header.classList.toggle('active');

            // 保存状态到本地存储
            localStorage.setItem(panelId + '-state', panel.classList.contains('open'));
        }

        // 退出登录功能
        function logout() {
            // 清除登录状态和令牌
            localStorage.removeItem('isLoggedIn');
            localStorage.removeItem('token');
            // 保留API URL等其他设置

            // 提示用户
            alert('您已成功退出登录');

            // 跳转回登录页面
            window.location.href = 'index.html';
        }

        // 页面加载时调用startGame
        window.onload = function() {
            // 检查是否已登录
            const token = localStorage.getItem('token');
            if (!token) {
                // 如果未登录，跳转回登录页
                window.location.href = 'index.html';
                return;
            }

            // 初始化折叠面板状态
            const shopPanel = document.getElementById('shop-section');
            const travelPanel = document.getElementById('travel-section');

            if (localStorage.getItem('shop-section-state') === 'true') {
                shopPanel.classList.add('open');
                shopPanel.previousElementSibling.classList.add('active');
            }

            if (localStorage.getItem('travel-section-state') === 'true') {
                travelPanel.classList.add('open');
                travelPanel.previousElementSibling.classList.add('active');
            }

            // 确保标签页正确初始化
            setTimeout(() => {
                // 手动初始化标签页，确保所有点击事件绑定正确
                try {
                    // 初始化标签页
                    initTabs();
                    console.log('标签页初始化成功');
                } catch (e) {
                    console.error('标签页初始化失败:', e);
                }
            }, 1000);

            // 已登录，启动游戏
            startGame();
        };
    </script>
</body>

</html>
